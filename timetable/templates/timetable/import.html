{% extends "timetable/base.html" %}
{% load static %}

{% block content %}
<style>
  .border-dashed { border-style: dashed !important; }
  .drop-hover { background-color: #f8f9fa; }
</style>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Upload file</h5>
        </div>

        <div class="card-body">
          <form id="importUploadForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Drop area / click area -->
            <div id="dropZone"
                 class="border border-2 border-dashed rounded-3 py-5 text-center mb-3 bg-light"
                 style="cursor:pointer;">
              <input type="file" id="fileInput"
                     name="requirements_file"
                     class="d-none" />

              <!-- default subtitle -->
              <p id="dz-sub-default"
                 class="text-muted mb-0 {% if upload_success %}d-none{% endif %}">
                You can upload 1 file
              </p>

              <!-- file metadata layout (visible only after successful upload) -->
              <div id="dz-sub-meta"
                   class="px-3 mt-2 d-flex justify-content-between align-items-center {% if not upload_success %}d-none{% endif %}">
                <span id="fileName" class="fw-semibold text-start">
                  {% if upload_success %}{{ uploaded_file_name }}{% endif %}
                </span>
                <span id="fileSize" class="text-muted small text-center">
                  {% if upload_success %}{{ uploaded_file_size_human }}{% endif %}
                </span>
                <button type="button"
                        id="fileClearBtn"
                        class="btn btn-sm btn-danger">
                  ×
                </button>
              </div>
            </div>

            <!-- Populate button -->
            <div class="d-flex justify-content-end mt-3">
              <button type="button"
                      id="populateBtn"
                      class="btn btn-primary"
                      {% if not upload_success %}disabled{% endif %}>
                Populate
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
    (function() {
      const form        = document.getElementById('importUploadForm');
      const fileInput   = document.getElementById('fileInput');
      const dropZone    = document.getElementById('dropZone');
      const dzSubDefault= document.getElementById('dz-sub-default');
      const dzSubMeta   = document.getElementById('dz-sub-meta');
      const fileNameEl  = document.getElementById('fileName');
      const fileSizeEl  = document.getElementById('fileSize');
      const fileClearBtn= document.getElementById('fileClearBtn');
      const populateBtn = document.getElementById('populateBtn');
    
      // initial state from server
      let uploadSuccess = '{{ upload_success|yesno:"true,false" }}' === 'true';
      let isUploading   = false;
    
      function setInitialStateFromServer() {
        if (uploadSuccess) {
          // file already uploaded successfully
          fileInput.disabled = true;
          populateBtn.disabled = false;
        } else {
          fileInput.disabled = false;
          populateBtn.disabled = true;
        }
        isUploading = false;
      }
    
      // on click, open file dialog
      dropZone.addEventListener('click', function() {
        if (uploadSuccess || isUploading) return;
        fileInput.click();
      });
    
      // when user chooses a file, submit the form (standard POST)
      fileInput.addEventListener('change', function(e) {
        if (!e.target.files.length) return;
        // show "Uploading..." in the drop area until the page reloads
        isUploading = true;
        dzSubDefault.classList.remove('d-none');
        dzSubMeta.classList.add('d-none');
        dzSubDefault.textContent = 'Uploading…';
        form.submit();
      });
    
      // drag & drop behaviour (still uses normal POST once a file is dropped)
      ['dragenter','dragover'].forEach(function(ev) {
        dropZone.addEventListener(ev, function(e) {
          e.preventDefault();
          e.stopPropagation();
          if (uploadSuccess || isUploading) return;
          dropZone.classList.add('drop-hover');
        });
      });
    
      ['dragleave','drop'].forEach(function(ev) {
        dropZone.addEventListener(ev, function(e) {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove('drop-hover');
        });
      });
    
      dropZone.addEventListener('drop', function(e) {
        if (uploadSuccess || isUploading) return;
        const dt = e.dataTransfer;
        if (!dt || !dt.files.length) return;
    
        const file = dt.files[0];  // enforce single file
        const dataTransferInput = fileInput;
    
        // put dropped file onto the hidden input, then submit
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        dataTransferInput.files = dataTransfer.files;

        isUploading = true;
        dzSubDefault.classList.remove('d-none');
        dzSubMeta.classList.add('d-none');
        dzSubDefault.textContent = 'Uploading…';
        form.submit();
      });
    
      // X button: reset
      fileClearBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        uploadSuccess = false;
        fileInput.disabled = false;
        isUploading   = false;
        fileInput.value = '';
        dzSubDefault.textContent = 'You can upload 1 file';
        dzSubDefault.classList.remove('d-none');
        dzSubMeta.classList.add('d-none');
        populateBtn.disabled = true;
      });
    
      // Populate – placeholder (later you’ll hook this up to your script)
      populateBtn.addEventListener('click', function() {
        if (!uploadSuccess) return;
        alert('Populate will use the uploaded file (placeholder for now).');
      });
    
      setInitialStateFromServer();
    })();
</script>
{% endblock %}
